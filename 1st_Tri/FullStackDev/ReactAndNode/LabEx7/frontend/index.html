<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-4xl mx-auto bg-white shadow-lg rounded-lg p-6">
        <h1 class="text-3xl font-bold mb-4">Restaurant Menu</h1>

        <!-- Filters -->
        <div class="flex gap-4 mb-4">
            <input id="itemInput" type="text" placeholder="Search Item" class="border p-2 rounded w-1/3">
            <input id="priceInput" type="number" placeholder="Max Price" class="border p-2 rounded w-1/3">
            <select id="categorySelect" class="border p-2 rounded w-1/3">
                <option value="">All Categories</option>
                <option value="Indian">Indian</option>
                <option value="Italian">Italian</option>
                <option value="Japanese">Japanese</option>
                <option value="Mexican">Mexican</option>
            </select>
            <button id="filterBtn" class="bg-blue-500 text-white px-4 py-2 rounded">Filter</button>
        </div>

        <!-- Data Container -->
        <div id="menuContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
