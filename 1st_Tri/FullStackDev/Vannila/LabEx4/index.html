<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Student Feedback Collection System</title>
</head>
<body class="m-0 p-4 bg-black text-white min-h-screen">

  <main class="flex flex-col items-center justify-start min-h-screen space-y-6">

    <!-- Feedback Form -->
    <form id="feedbackForm" class="bg-gray-800 p-8 rounded-xl shadow-lg w-full max-w-md space-y-6 border border-gray-700">
      <h2 class="text-2xl font-bold text-center text-white">Student Feedback</h2>

      <div>
        <label for="name" class="block text-gray-200 font-semibold mb-1">Name:</label>
        <input type="text" id="name" name="name" required
          class="w-full border border-gray-600 bg-black text-white rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-white" />
      </div>

      <div>
        <label for="email" class="block text-gray-200 font-semibold mb-1">Email:</label>
        <input type="email" id="email" name="email" required
          class="w-full border border-gray-600 bg-black text-white rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-white" />
      </div>

      <div>
        <label for="department" class="block text-gray-200 font-semibold mb-1">Department:</label>
        <select id="department" name="department" required
          class="w-full border border-gray-600 bg-black text-white rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-white">
          <option value="" disabled selected>Select your department</option>
          <option value="cs">Computer Science</option>
          <option value="ece">Electronics & Communication</option>
          <option value="mech">Mechanical Engineering</option>
          <option value="civil">Civil Engineering</option>
          <option value="bio">Biotechnology</option>
          <option value="maths">Mathematics</option>
          <option value="physics">Physics</option>
          <option value="chem">Chemistry</option>
          <option value="commerce">Commerce</option>
          <option value="english">English</option>
        </select>
      </div>

      <div>
        <span class="block text-gray-200 font-semibold mb-1">Rating:</span>
        <div class="flex gap-4">
          <label class="flex items-center space-x-1"><input type="radio" name="rating" value="1" required class="accent-white"/><span>1</span></label>
          <label class="flex items-center space-x-1"><input type="radio" name="rating" value="2" class="accent-white"/><span>2</span></label>
          <label class="flex items-center space-x-1"><input type="radio" name="rating" value="3" class="accent-white"/><span>3</span></label>
          <label class="flex items-center space-x-1"><input type="radio" name="rating" value="4" class="accent-white"/><span>4</span></label>
          <label class="flex items-center space-x-1"><input type="radio" name="rating" value="5" class="accent-white"/><span>5</span></label>
        </div>
      </div>

      <div>
        <label for="feedback" class="block text-gray-200 font-semibold mb-1">Feedback:</label>
        <textarea id="feedback" name="feedback" required rows="4" maxlength="250"
          class="w-full border border-gray-600 bg-black text-white rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-white resize-none"></textarea>
        <p id="charCount" class="text-sm text-gray-400 text-right mt-1">0/250</p>
      </div>

      <button type="submit"
        class="w-full bg-white text-black font-semibold py-2 rounded hover:bg-gray-200 transition">
        Submit Feedback
      </button>
    </form>

    <!-- Welcome Message -->
    <div id="welcomeMessage" class="text-xl font-semibold text-green-400"></div>

    <!-- Clear All Button -->
    <button id="clearFeedbacks"
      class="bg-white text-black px-4 py-2 rounded hover:bg-gray-200 transition">
      Clear All Feedbacks
    </button>

    <!-- Feedback Display -->
    <section id="feedbackContainer" class="mt-6 space-y-4 w-full max-w-3xl px-4"></section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
