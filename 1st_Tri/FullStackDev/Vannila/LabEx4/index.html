<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Student Feedback Collection System</title>
</head>
<body class="m-0 p-0 bg-gray-100">
    <main class="flex flex-col items-center justify-center min-h-screen">
        <form action="" id="feedbackForm" class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md space-y-6">
            
            <!-- Name Field -->
            <div>
                <label for="name" class="block text-gray-700 font-semibold mb-1">Name:</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
            </div>

            <!-- Email Field -->
            <div>
                <label for="email" class="block text-gray-700 font-semibold mb-1">Email:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
            </div>

            <!-- Department Dropdown -->
            <div>
                <label for="department" class="block text-gray-700 font-semibold mb-1">Department:</label>
                <select
                    id="department"
                    name="department"
                    required
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"
                >
                    <option value="" disabled selected>Select your department</option>
                    <option value="cs">Computer Science</option>
                    <option value="ece">Electronics & Communication</option>
                    <option value="mech">Mechanical Engineering</option>
                    <option value="civil">Civil Engineering</option>
                    <option value="bio">Biotechnology</option>
                    <option value="maths">Mathematics</option>
                    <option value="physics">Physics</option>
                    <option value="chem">Chemistry</option>
                    <option value="commerce">Commerce</option>
                    <option value="english">English</option>
                </select>
            </div>

            <!-- Rating (Radio Buttons) -->
            <div>
                <span class="block text-gray-700 font-semibold mb-1">Rating:</span>
                <div class="flex gap-4">
                    <label class="flex items-center space-x-1">
                        <input type="radio" id="rating1" name="rating" value="1" required class="accent-blue-600"/>
                        <span>1</span>
                    </label>
                    <label class="flex items-center space-x-1">
                        <input type="radio" id="rating2" name="rating" value="2" class="accent-blue-600"/>
                        <span>2</span>
                    </label>
                    <label class="flex items-center space-x-1">
                        <input type="radio" id="rating3" name="rating" value="3" class="accent-blue-600"/>
                        <span>3</span>
                    </label>
                    <label class="flex items-center space-x-1">
                        <input type="radio" id="rating4" name="rating" value="4" class="accent-blue-600"/>
                        <span>4</span>
                    </label>
                    <label class="flex items-center space-x-1">
                        <input type="radio" id="rating5" name="rating" value="5" class="accent-blue-600"/>
                        <span>5</span>
                    </label>
                </div>
            </div>

            <!-- Feedback Textarea -->
            <div>
                <label for="feedback" class="block text-gray-700 font-semibold mb-1">Feedback:</label>
                <textarea
                    id="feedback"
                    name="feedback"
                    required
                    rows="4"
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"
                ></textarea>
            </div>

            <!-- Submit Button -->
            <button
                type="submit"
                class="w-full bg-blue-600 text-white font-semibold py-2 rounded hover:bg-blue-700 transition"
            >
                Submit Feedback
            </button>
        </form>
    </main>
    <script src="./script.js"></script>
</body>
</html>
